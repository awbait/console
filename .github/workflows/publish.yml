name: Publish

# Builds and pushes the portal and collector images to GHCR on every `v*` tag.
# Triggered by the tag that release.yml pushes (or by a tag pushed by hand for a
# hotfix). The tag is the single source of the version stamped into the portal
# binary (buildinfo -> the About page); .dockerignore excludes .git, so the
# version/commit/date are injected via --build-arg here, as the Dockerfile expects.
#
# Each pushed image is also saved as a `docker load`-able archive and attached to
# the GitHub Release of the tag, so an installation with no access to GHCR has
# something to carry in.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  images:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portal
            context: .
            file: Dockerfile
          - name: collector
            context: collector
            file: collector/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # The multi-platform build above goes straight to the registry and never
      # lands in the local daemon, so the archive is made from the pushed image.
      # linux/amd64 only: that is what the on-prem installations run.
      - name: Archive the image
        run: |
          image="ghcr.io/${{ github.repository }}/${{ matrix.name }}:${GITHUB_REF_NAME}"
          docker pull --platform linux/amd64 "$image"
          docker save "$image" \
            | gzip > "console-${{ matrix.name }}-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
          ls -lh console-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: image-archive-${{ matrix.name }}
          path: console-*.tar.gz
          retention-days: 1

  assets:
    name: release assets
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-archive-*
          merge-multiple: true

      - name: Checksums
        run: |
          sha256sum console-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # release.yml creates the Release right after pushing the tag, minutes
      # before the images are built, so it is normally already there. A tag
      # pushed by hand may have no Release at all: then there is nothing to
      # attach to and the images in GHCR are the whole result.
      - name: Wait for the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "no release for $GITHUB_REF_NAME, nothing to attach the archives to"
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Attach the archives to the release
        if: steps.release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" console-*.tar.gz SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
