<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console - Managed Services</title>
    <!-- Icons. The .ico goes first and the .svg after it, so a browser that
         understands both picks the scalable one and an old browser stops at the
         first it can read. The mark sits on its own brand-blue chip, so one file
         works on a light and a dark tab alike. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The theme is set before the first paint, so a dark portal never flashes
         white on the way in. Anything other than a stored theme - no choice yet,
         or the choice to follow the system - asks the system. Mirrors
         ThemeContext; the two have to agree or the page repaints on load. -->
    <script>
      try {
        var t = localStorage.getItem("idp-theme");
        if (t !== "light" && t !== "dark" && t !== "rn") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
